name: Bug report
description: Report an issue with selection tools or options.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a public URL if possible. Leave private selected text out of reports.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome version and operating system
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Relevant option settings and other enabled selection extensions
